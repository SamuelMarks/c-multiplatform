repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.6.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: mixed-line-ending
- repo: https://github.com/pre-commit/mirrors-clang-format
  rev: v18.1.8
  hooks:
  - id: clang-format
    name: clang-format (auto-fix)
    exclude: ^vendor/
    args:
    - -style=LLVM
    - -i
    types_or:
    - c
    - c++
  - id: clang-format
    name: clang-format (recheck)
    exclude: ^vendor/
    args:
    - -style=LLVM
    - --dry-run
    - -Werror
    types_or:
    - c
    - c++
- repo: https://github.com/pre-commit/mirrors-eslint
  rev: v9.9.0
  hooks:
  - id: eslint
    name: eslint (auto-fix)
    args:
    - --config
    - eslint.config.js
    - --fix
    additional_dependencies:
    - eslint@9.9.0
    - eslint-config-prettier@9.1.0
  - id: eslint
    name: eslint (recheck)
    args:
    - --config
    - eslint.config.js
    additional_dependencies:
    - eslint@9.9.0
    - eslint-config-prettier@9.1.0
- repo: local
  hooks:
  - id: build-compilation-db
    name: Build Compilation Database
    entry: bash -c "unset GIT_INDEX_FILE GIT_DIR GIT_WORK_TREE && cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON"
    language: system
    pass_filenames: false
  - id: check-api-returns
    name: Check API Error Returns
    entry: python -c "import sys; sys.argv[0]='check_error_percolation_clang.py';
      import urllib.request; exec(urllib.request.urlopen('https://raw.githubusercontent.com/SamuelMarks/c-ci/master/precommit_hooks/check_error_percolation_clang.py').read())"
    language: python
    additional_dependencies:
    - libclang
    types_or:
    - c
    - c++
    args:
    - --ignore-callers
    - run_*
    - test_*
    - TEST*
    - main
    - thread_task_*
    - async_task_*
    - force_depth_error
  - id: cppcheck
    name: Cppcheck
    entry: python -c "import urllib.request; exec(urllib.request.urlopen('https://raw.githubusercontent.com/SamuelMarks/c-ci/master/precommit_matrix.py').read())"
      cppcheck
    language: python
    pass_filenames: false
    types_or:
    - c
    - c++
  - id: build-gcc
    name: Build (GCC)
    entry: python -c "import urllib.request; exec(urllib.request.urlopen('https://raw.githubusercontent.com/SamuelMarks/c-ci/master/precommit_matrix.py').read())"
      build gcc
    language: python
    pass_filenames: false
  - id: test-gcc
    name: Test (GCC)
    entry: python -c "import urllib.request; exec(urllib.request.urlopen('https://raw.githubusercontent.com/SamuelMarks/c-ci/master/precommit_matrix.py').read())"
      test gcc
    language: python
    pass_filenames: false
  - id: build-clang
    name: Build (Clang)
    entry: python -c "import urllib.request; exec(urllib.request.urlopen('https://raw.githubusercontent.com/SamuelMarks/c-ci/master/precommit_matrix.py').read())"
      build clang
    language: python
    pass_filenames: false
  - id: test-clang
    name: Test (Clang)
    entry: python -c "import urllib.request; exec(urllib.request.urlopen('https://raw.githubusercontent.com/SamuelMarks/c-ci/master/precommit_matrix.py').read())"
      test clang
    language: python
    pass_filenames: false
  - id: build-msvc-wine
    name: Build & Test (MSVC Wine)
    entry: bash -c 'unset GIT_INDEX_FILE GIT_DIR GIT_WORK_TREE; if command -v wine >/dev/null 2>&1 && [ -d "${MSVC_WINE_PATH:-$HOME/my_msvc/opt/msvc}"
      ]; then bash ~/repos/c-ci/build_msvc_wine.sh -DCMAKE_DISABLE_FIND_PACKAGE_SQLite3=ON
      -DCMAKE_DISABLE_FIND_PACKAGE_ZLIB=ON -DCMAKE_DISABLE_FIND_PACKAGE_Brotli=ON
      -DCMAKE_DISABLE_FIND_PACKAGE_CURL=ON > wine_hook.log 2>&1; RET=$?; cat wine_hook.log;
      rm -f wine_hook.log; wineserver -k9 || true; exit $RET; else echo "Skipping
      MSVC Wine"; fi'
    language: system
    pass_filenames: false
  - id: build-msvc
    name: Build (MSVC)
    entry: python -c "import urllib.request; exec(urllib.request.urlopen('https://raw.githubusercontent.com/SamuelMarks/c-ci/master/precommit_matrix.py').read())"
      build msvc
    language: python
    pass_filenames: false
  - id: test-msvc
    name: Test (MSVC)
    entry: python -c "import urllib.request; exec(urllib.request.urlopen('https://raw.githubusercontent.com/SamuelMarks/c-ci/master/precommit_matrix.py').read())"
      test msvc
    language: python
    pass_filenames: false
  - id: build-mingw
    name: Build (MinGW)
    entry: python -c "import urllib.request; exec(urllib.request.urlopen('https://raw.githubusercontent.com/SamuelMarks/c-ci/master/precommit_matrix.py').read())"
      build mingw
    language: python
    pass_filenames: false
  - id: test-mingw
    name: Test (MinGW)
    entry: python -c "import urllib.request; exec(urllib.request.urlopen('https://raw.githubusercontent.com/SamuelMarks/c-ci/master/precommit_matrix.py').read())"
      test mingw
    language: python
    pass_filenames: false
  - id: wasm-layout-assertions
    name: Wasm Layout Assertions
    entry: bash -c "unset GIT_INDEX_FILE GIT_DIR GIT_WORK_TREE && rm -rf build_wasm && mkdir build_wasm && cd build_wasm && cmake .. && make test_ui_layout_observer && ./bin/test_ui_layout_observer"
    language: system
    pass_filenames: false
  - id: valgrind
    name: Valgrind (GCC)
    entry: python -c "import urllib.request; exec(urllib.request.urlopen('https://raw.githubusercontent.com/SamuelMarks/c-ci/master/precommit_matrix.py').read())"
      valgrind gcc
    language: python
    pass_filenames: false
  - id: update-shields
    name: Update README Shields
    entry: python -c "import urllib.request; exec(urllib.request.urlopen('https://raw.githubusercontent.com/SamuelMarks/c-ci/master/precommit_matrix.py').read())"
      shields
    language: python
    additional_dependencies:
    - gcovr
    pass_filenames: false
